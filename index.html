{t:`Variables & Types`,b:`print type int float str bool None True False`,n:`A variable is a name that holds a value: age = 12. Core types: int (5), float (2.5), str ("hi"), bool (True / False) and None (no value). print() shows values; type() tells you what you have.`,
ex:`name = "Ada"
age = 12
print(name, age, type(age))
print(type(2.5), type(True), type(None))`,
q:[[`Which line creates a variable?`,[`print(x)`,`x = 5`,`5 = x`],1,`= assigns; the name goes on the left.`],[`type(2.5) is…`,[`int`,`float`,`str`],1,`Numbers with a decimal point are floats.`]],
x:{p:`Create variables city (a str) and year (an int). Print them on one line separated by a space, then print type(year).`,s:``,h:`print(city, year) puts a space between values.`,t:`assert isinstance(city,str) and isinstance(year,int),"city must be a str and year an int"
L=OUT.strip().splitlines()
assert L[0]==city+" "+str(year),"first line must be: city year"
assert "int" in L[1],"print type(year) on the second line"`},
d:{p:`This should print 15 but prints 105. Fix it.`,s:`a = "10"
b = "5"
print(a + b)`,h:`Quotes make text; convert with int() or drop the quotes.`,t:`assert OUT.strip()=="15","it must print 15"`}},
{t:`Numbers & Math`,b:`abs round divmod pow min max sum complex`,n:`+ - * / ** do math; // is whole-number division and % the remainder. Built-ins: abs, round(x, digits), divmod(a, b), pow(a, b, mod), min, max, sum, complex.`,
ex:`print(7 // 2, 7 % 2, 2 ** 5)
print(abs(-3), round(3.14159, 2), divmod(17, 5))
print(pow(2, 10, 1000), min(4, 2, 9), max([1, 5]), sum(range(5)))
print(complex(1, 2) * 2)`,
q:[[`What does divmod(17, 5) return?`,[`(3, 2)`,`(2, 3)`,`3.4`],0,`17 = 5*3 + 2, so (quotient, remainder).`],[`7 // 2 equals…`,[`3.5`,`3`,`4`],1,`// drops the fraction.`]],
x:{p:`Given vals below, print the largest absolute value rounded to 2 decimals, then print divmod(100, 7).`,s:`vals = [3.14159, -2.71828, 1.41421]
`,h:`max(abs(v) for v in vals), then round(..., 2).`,t:`assert OUT.strip().splitlines()==["3.14","(14, 2)"],"expected 3.14 then (14, 2)"`},
d:{p:`This should print the average (4) but prints the sum. Fix it.`,s:`nums = [2, 4, 6]
print(sum(nums))`,h:`Divide by len(nums).`,t:`assert OUT.strip() in ("4","4.0"),"the average of 2, 4, 6 is 4"`}},
{t:`Text & Number Bases`,b:`len repr format ord chr ascii bin hex oct`,n:`Strings are sequences: s[0], s[-1], s[1:4], s[::-1]. Methods: upper, split, join, replace, strip. len counts, repr shows exact text, format() / f-strings pretty-print, ord/chr convert characters and codes, bin/hex/oct show other bases, ascii escapes non-ASCII.`,
ex:`s = "Python"
print(len(s), s[0], s[-1], s[1:4], s[::-1])
print(repr("hi"), ascii("é"), format(3.14159, ".2f"))
print(ord("A"), chr(97), bin(10), hex(255), oct(8))
print(", ".join(["a", "b"]).upper())`,
q:[[`What is "python"[1:4]?`,[`pyt`,`yth`,`ytho`],1,`Slices start at 1 and stop before 4.`],[`chr(ord("a") + 1) gives…`,[`b`,`c`,`98`],0,`ord gives the code, +1 moves one letter, chr converts back.`]],
x:{p:`Given word = "Python", print it reversed, then print len(word) written in hex (use hex()).`,s:`word = "Python"
`,h:`word[::-1] and hex(len(word)).`,t:`assert OUT.strip().splitlines()==["nohtyP","0x6"],"expected nohtyP then 0x6"`},
d:{p:`This should print the letter after "c" but prints a number. Fix it.`,s:`print(ord("c") + 1)`,h:`chr() turns a code back into a letter.`,t:`assert OUT.strip()=="d","it must print d"`}},
{t:`Logic & Loops`,b:`all any range enumerate zip reversed sorted`,n:`if/elif/else choose a path; and, or, not combine conditions. Falsy values: 0, "", [], None. for loops walk sequences; range(n) gives 0..n-1; enumerate adds an index, zip pairs lists, reversed flips, sorted returns a new sorted list; all() needs every item truthy, any() at least one. break exits a loop, continue skips an iteration.`,
ex:`for i, c in enumerate("abc"):
    print(i, c)
for a, b in zip([1, 2], "xy"):
    print(a, b)

{t:`Collections`,b:`list tuple set frozenset dict slice`,n:`list [1, 2] is ordered and changeable; tuple (1, 2) is fixed; set {1, 2} keeps unique items; frozenset is an immutable set; dict {"a": 1} maps keys to values. slice(1, 4) is a reusable slice. Handy: append, len, in, get, keys, items.`,
ex:`xs = list("abca")
print(xs, tuple(xs), set(xs), frozenset(xs))

`,h:`counts[n] = counts.get(n, 0) + 1`,t:`assert OUT.strip().splitlines()==["3","{1: 1, 2: 2, 3: 3}"],"expected 3 then {1: 1, 2: 2, 3: 3}"`},
d:{p:`This should print 36 but raises KeyError. Fix the lookup.`,s:`ages = {"Ada": 36}
print(ages["ada"])`,h:`Keys are case-sensitive.`,t:`assert OUT.strip()=="36","it must print 36"`}},
{t:`Functions`,b:`callable map filter iter next`,n:`def name(params): ... return value defines reusable code. Defaults: def f(x, y=2). lambda makes tiny functions. map applies a function to every item, filter keeps items that pass, iter/next step through an iterable by hand (next(it, default) avoids errors), callable() tells whether something can be called.`,
ex:`def greet(name, punct="!"):
    return "Hi " + name + punct
print(greet("Bo"), greet("Al", "?"))

x:{p:`Write power(base, exp=2) returning base ** exp. Print power(5), then power(2, 10).`,s:`def power(base, exp=2):

assert OUT.split()==["25","1024"],"expected 25 then 1024"`},

{t:`Errors & Exceptions`,b:`ValueError TypeError ZeroDivisionError KeyError IndexError AssertionError Exception`,n:`Errors are exceptions with names: ValueError (right type, bad value), TypeError (wrong type), ZeroDivisionError, KeyError (missing dict key), IndexError (bad list index), AssertionError (failed assert). try/except catches them; finally always runs; raise throws your own. Catch specific errors, not everything.`,

try:

except AssertionError as e:

x:{p:`Write safe_int(text) returning int(text), or None if text is not a valid number. Print safe_int("42") and safe_int("abc").`,s:``,h:`Wrap int(text) in try and catch ValueError.`,t:`assert OUT.split()==["42","None"],"expected 42 then None"`},

{t:`Objects & Introspection`,b:`isinstance issubclass getattr setattr hasattr delattr dir vars property classmethod staticmethod super object id hash`,n:`A class bundles data and behavior; __init__ sets up each object and self is that object. Subclasses inherit; super() reaches the parent. isinstance/issubclass test types; getattr/setattr/hasattr/delattr use attribute names; dir and vars list them; id and hash identify; property makes computed attributes; classmethod/staticmethod bind to the class; object is the root of every class.`,
ex:`class Animal:
    def __init__(self, name):
        self.name = name
    @property
    def shout(self):
        return self.name.upper()
class Dog(Animal):
    def __init__(self, name):
        super().__init__(name)
        self.tricks = 0
d = Dog("rex")
print(d.shout, isinstance(d, Animal), issubclass(Dog, object))
setattr(d, "tricks", 3)
print(getattr(d, "tricks"), hasattr(d, "age"), vars(d))
delattr(d, "tricks")
print("tricks" in dir(d), id(d) == id(d), hash("a") == hash("a"))`,

{t:`Deep Dive: Comprehensions & Generators`,b:`list dict set iter next`,n:`A comprehension builds a collection in one expression: [x * 2 for x in range(5) if x != 3] (list), {k: v for ...} (dict), {x for ...} (set). Several for clauses nest left to right. Square brackets build the whole list at once; round brackets make a generator expression that computes items lazily, one per next(). A function containing yield is a generator function: calling it runs nothing until you iterate, each yield pauses and remembers its state, and finishing ends the iteration. A generator can be consumed only once. sum(), min() and max() accept generators directly.`,

    while n > 0:
        yield n

{t:`Deep Dive: Arguments, Closures & Decorators`,b:`callable map filter sorted`,n:`Parameters can be positional, have defaults (def f(a, b=2)), collect extras with *args (a tuple) and **kwargs (a dict), and come after a bare * as keyword-only. At the call site f(*items, **options) unpacks them. Never use a mutable default like b=[]: it is shared between calls. A closure is an inner function that remembers variables of the function that made it; nonlocal lets it rebind them. A decorator is a function that takes a function and returns a replacement: @deco above def f means f = deco(f). Give the wrapper *args, **kwargs so it fits any function.`,
ex:`def show(a, b=2, *args, key=0, **kw):
    return a, b, args, key, kw
print(show(1), show(1, 3, 4, 5, key=9, z=1))

def counter():
    n = 0
    def tick():
        nonlocal n
        n += 1
        return n
    return tick
t = counter()
print(t(), t(), t())
def twice(f):
    def wrapper(*args, **kw):
        return [f(*args, **kw), f(*args, **kw)]
    return wrapper
@twice
def hi(name): return "hi " + name
print(hi("Bo"), callable(hi), sorted(["bb", "a"], key=len), list(map(str, filter(None, [0, 1, 2]))))`,

{t:`Deep Dive: Inheritance, Dunders & Dataclasses`,b:`object super property isinstance len repr`,n:`A subclass inherits everything from its parent: class Dog(Animal). Override a method to change it and call super().method() to reuse the parent's version. Dunder (double-underscore) methods plug your class into Python: __repr__ (developer text, also used by print when __str__ is missing), __str__ (friendly text), __eq__, __lt__ (so sorted works), __len__ (len(obj)), __add__ (obj + obj), __iter__, __getitem__ (obj[i]), __contains__ (in), __bool__, __call__. Return NotImplemented for types you do not understand. @dataclass writes __init__, __repr__ and __eq__ from annotated fields, which can have defaults.`,
ex:`from dataclasses import dataclass
class Base:
    def hello(self): return "base"
class Kid(Base):
    def hello(self): return super().hello() + "+kid"
class Bag:
    def __init__(self, *items): self.items = list(items)
    def __len__(self): return len(self.items)
    def __getitem__(self, i): return self.items[i]
    def __contains__(self, x): return x in self.items
    def __repr__(self): return "Bag" + repr(tuple(self.items))
    def __add__(self, o): return Bag(*self.items, *o.items)
b = Bag(1, 2) + Bag(3)
print(Kid().hello(), len(b), b[0], 2 in b, b, list(b))
@dataclass
class P:
    x: int
    y: int = 0
print(P(1), P(1) == P(1, 0))`,

{t:`Context Managers`,b:`open object`,n:`with runs setup and guaranteed cleanup: with open("f.txt") as f: closes the file even after an error. Any object with __enter__(self) (its return value goes to as) and __exit__(self, exc_type, exc, tb) works; if __exit__ returns True the exception is swallowed. contextlib.contextmanager turns a generator with ONE yield into a context manager: code before yield is setup, code after it is cleanup (put the yield in try/finally to survive errors). contextlib.suppress(ValueError) ignores that error, and one with can hold several managers: with a() as x, b() as y.`,
ex:`from contextlib import contextmanager, suppress
class Tag:
    def __init__(self, name): self.name = name
    def __enter__(self):
        print("enter", self.name)
        return self
    def __exit__(self, kind, err, tb):
        print("exit", self.name, kind.__name__ if kind else None)
        return kind is KeyError
with Tag("a") as t:
    print("inside", t.name)
with Tag("b"):
    {}["x"]
print("survived")
@contextmanager
def shout(msg):
    print("start", msg)
    try:
        yield msg.upper()
    finally:
        print("end", msg)
with shout("hi") as up, suppress(ValueError):
    print(up)
    int("x")`,

{t:`match, Walrus & Type Hints`,b:`type isinstance len`,n:`match subject: case pattern: compares structure. Patterns: literals (case 0), alternatives (case 1 | 2), sequences (case [x, y], case [first, *rest]), mappings (case {"k": v}), class patterns (case int(), case Point(x=0)), guards (case n if n > 9), captures (names bind values) and case _ (default, must come last). := (walrus) assigns inside an expression: if (n := len(xs)) > 3. Type hints document types and are NOT enforced: def f(x: int, y: str = "a") -> list[int]; n: int = 3. Common forms: list[int], dict[str, int], tuple[int, ...], int | None, Callable, Any, TypeVar. They live in f.__annotations__ and are checked by tools like mypy, not by Python.`,
ex:`def kind(x):
    match x:
        case 0: return "zero"
        case 1 | 2: return "small"
        case int() if x < 0: return "negative"

        case [first, *rest]: return "list from " + str(first)
        case {"k": v}: return "dict k=" + str(v)
        case str() as s: return "text " + s
        case _: return "other"
print([kind(v) for v in (0, 2, -5, 9, [1, 2], [7, 8, 9], {"k": 1}, "hi", 1.5)])
if (n := len("hello")) > 3:

{t:`Async/Await & asyncio`,b:`aiter anext`,n:`async def defines a coroutine function: calling it returns a coroutine object that does nothing until it is awaited (await coro) or scheduled. await pauses this coroutine until the other one finishes, letting others run. asyncio.sleep(s) is the non-blocking pause (time.sleep blocks everything). asyncio.gather(c1, c2) runs coroutines concurrently and returns results in the order given; asyncio.create_task starts one in the background; asyncio.wait_for adds a timeout; async with and async for use async context managers and iterators; asyncio.run(main()) starts the event loop in a normal script (this page already runs one, so use top-level await). Concurrency helps while WAITING (network, files), not with heavy computation.`,
ex:`import asyncio
async def work(name, delay):
    await asyncio.sleep(delay)
    return name + " done"
print(await asyncio.gather(work("a", 0.02), work("b", 0.01)))
task = asyncio.create_task(work("c", 0))
print(await task)
try:
    await asyncio.wait_for(asyncio.sleep(1), 0.01)
except asyncio.TimeoutError:
    print("timeout")
class Gate:
    async def __aenter__(self):
        print("open")
        return self
    async def __aexit__(self, *a):
        print("close")
async with Gate():
    print("inside")
print(asyncio.iscoroutinefunction(work))`,

/* ---- Ask the AI about one block of the lesson. ----
   Precision: the learner can pin the exact words or code they mean (select text, or press "Ask about this code").
   Engagement: every answer comes with clickable follow-up questions and usually a quick check worth XP. */
const ASKH={},ASKF={},ASKB={},CKQ={};let CKN=0;
const CHIPS=["Explain it more simply","Give me another example","Quiz me on this"],PINCHIPS=["What does this mean?","Why is it written this way?","Show me an example"];
/* The AI ends each answer with "CHECK: ..." and "NEXT: a | b | c". Split those off from the text to show. */
function parseAns(a){let check="",next=[];const keep=[];for(const l of String(a).replace(/\r/g,"").split("\n")){let m=l.match(/^\s*\**CHECK:\**\s*(.+)$/);if(m){check=m[1].trim();continue}m=l.match(/^\s*\**NEXT:\**\s*(.+)$/);if(m){next=m[1].split("|").map(x=>x.trim().replace(/^[-*\d.)\s]+/,"")).filter(x=>x&&x.length<70).slice(0,3);continue}keep.push(l)}return{text:keep.join("\n").trim(),check,next}}
const upXp=()=>{const e=$("xpv");if(e)e.textContent="XP "+S.xp};
function setChips(n,arr,lost){const c=$("aqc-"+n);if(!c)return;const a=(arr&&arr.length?arr:CHIPS).slice();if(lost)a.push("I'm still lost");c.innerHTML=a.map(x=>`<button onclick="askGo(${n},this.textContent)">${esc(x)}</button>`).join("")}
function aqShow(n){const b=$("ab-"+n);if(!b)return null;b.hidden=false;
if(!b.dataset.init){b.dataset.init=1;b.innerHTML=`<div class=am id=am-${n}></div><div class=aqc id=aqc-${n}></div><div class=af id=af-${n} hidden></div><textarea class=aqi id=aqt-${n} rows=2 spellcheck=true placeholder="Ask anything about this part. Enter sends, Shift+Enter adds a line." onkeydown="aqk(event,${n})"></textarea><button class=sec id=aqb-${n} onclick="askGo(${n})">Ask</button> <button class=x onclick="aq(${n})">Close</button><small>Tip: highlight any words or code in the lesson, then press "Ask the AI about this" to ask about that exact part.</small>`;setChips(n)}
return b}
function aq(n){const b=$("ab-"+n);if(!b)return;if(!b.hidden){b.hidden=true;return}aqShow(n);$("aqt-"+n).focus()}
function aqk(e,n){if(e.key=="Enter"&&!e.shiftKey){e.preventDefault();askGo(n)}}
/* Pin the exact words or code the next question is about. */
function pin(n,f){if(!aqShow(n))return;ASKF[n]=f;const p=$("af-"+n);p.hidden=false;p.innerHTML=`<span>About: <i>${esc(f.label)}</i></span> <button class=x onclick="unpin(${n})" aria-label="Remove">×</button>`;setChips(n,f.code?["What does this code do?","Why does it print that?","What if I change it?"]:PINCHIPS);$("aqt-"+n).focus()}
function unpin(n){delete ASKF[n];const p=$("af-"+n);if(p){p.hidden=true;p.innerHTML=""}}
function askCode(b){const k=b.closest(".blk");if(!k||k.dataset.n==null)return;const w=b.closest(".cb"),ro=w.querySelector(".ro"),code=w.querySelector(".src").value,
out=ro.hidden?"":[...ro.querySelectorAll("pre.po,.err .et,.err .el")].map(x=>x.textContent).join("\n").trim();
pin(+k.dataset.n,{code:1,label:out?"this code and its result":"this code",text:"Code:\n"+code.slice(0,1500)+(out?"\nWhat it showed when run:\n"+out.slice(0,600):"")})}
/* A short question the AI asks to test the idea it just explained. Answering it correctly earns XP. */
function checkCard(n,q){const id=++CKN;CKQ[id]=q;return`<div class=chk id=ck${id} data-tries=0><div class=lbl>Quick check</div><p>${inl(q)}</p><textarea class=aqi id=cki${id} rows=2 placeholder="Your answer. Enter to check it." onkeydown="ckk(event,${n},${id})"></textarea><button class=sec id=ckb${id} onclick="ckGo(${n},${id})">Check my answer</button> <button class=x onclick="ckSkip(${id})">Skip</button><div class=ckr id=ckr${id}></div></div>`}
function ckk(e,n,id){if(e.key=="Enter"&&!e.shiftKey){e.preventDefault();ckGo(n,id)}}
function ckGo(n,id){const v=($("cki"+id)||{}).value;if(v&&v.trim())return askGo(n,v.trim(),{check:id})}
function ckSkip(id){const c=$("ck"+id);if(c)c.remove()}
function verdict(n,id,text){const c=$("ck"+id);if(!c||c.dataset.done)return;c.dataset.tries=(+c.dataset.tries||0)+1;const r=$("ckr"+id);
if(/^\W*Right!/i.test(text)){c.dataset.done=1;const xp=c.dataset.tries==1?5:2;S.xp+=xp;tick();sv();upXp();$("cki"+id).disabled=true;$("ckb"+id).hidden=true;c.querySelector(".x").hidden=true;r.innerHTML=`<b>Right! +${xp} XP</b>`}
else r.innerHTML=`Not there yet. Edit your answer and try again, or <button class=x onclick="askGo(${n},'Show me the answer to the quick check')">show me the answer</button>`}
async function askGo(n,pre,o){o=o||{};const t=$("aqt-"+n),bt=$("aqb-"+n),m=$("am-"+n),s=SECS[n];if(!t||!s||ASKB[n])return;
const q=(pre!=null?pre:t.value).trim();if(!q)return;const f=o.check?null:ASKF[n];
let sent=q;if(o.check)sent="Check question: "+CKQ[o.check]+"\nMy answer: "+q;
else if(f)sent=(f.code?"[Pointing at this code (and what happened when it ran, if shown)]\n"+f.text:`[Pointing at this exact text: "${f.text}"]`)+"\n\n"+q;
const h=ASKH[n]=ASKH[n]||[],ckb=o.check?$("ckb"+o.check):null;ASKB[n]=1;if(pre==null)t.value="";bt.disabled=true;bt.textContent="Thinking…";if(ckb)ckb.disabled=true;if(f)unpin(n);
m.insertAdjacentHTML("beforeend",`<div class=aqu>${f?`<div class=aqf>About: ${esc(f.label)}</div>`:""}${o.check?"My answer: ":""}${esc(q)}</div>`);
const w=document.createElement("div");w.className="aqa";w.textContent="Thinking…";m.appendChild(w);
try{const raw=cut(await ai("ask",{unit:s.unit,section:s.sec,part:s.title,text:s.text,question:sent,mode:o.check?"check":undefined,history:h.slice(-8)})),p=parseAns(raw);
h.push({role:"user",text:sent},{role:"assistant",text:raw});
w.innerHTML=body(p.text.split("\n"))+(p.check?checkCard(n,p.check):"");fit(w);setChips(n,p.next,1);if(o.check)verdict(n,o.check,p.text)}
catch(e){w.className="aqa bad";w.textContent="Could not get an answer: "+e.message}
ASKB[n]=0;bt.disabled=false;bt.textContent="Ask";if(ckb)ckb.disabled=false;w.scrollIntoView({block:"nearest",behavior:"smooth"})}
/* Highlight words (or code in an editor) inside a lesson part and a button appears to ask about exactly that. */
let SELN=null;
function selUi(){const b=$("selask");if(!b)return;const hide=()=>{b.hidden=true;SELN=null},ae=document.activeElement,inTa=ae&&ae.matches&&ae.matches("textarea.src")&&ae.selectionEnd>ae.selectionStart;let text="",n=null,rect=null;
if(inTa){text=ae.value.slice(ae.selectionStart,ae.selectionEnd);const k=ae.closest(".blk");n=k&&k.dataset.n;rect=ae.getBoundingClientRect()}
else{const s=getSelection();if(!s||s.isCollapsed||!s.rangeCount)return hide();text=s.toString();const r=s.getRangeAt(0),c=r.commonAncestorContainer,el=c.nodeType==1?c:c.parentElement,k=el&&el.closest?el.closest(".blk"):null;if(!k)return hide();n=k.dataset.n;rect=r.getBoundingClientRect()}
text=text.trim();if(n==null||text.length<2)return hide();
SELN={n:+n,text};b.hidden=false;const bw=b.offsetWidth||200;b.style.left=Math.max(8,Math.min(innerWidth-bw-8,rect.left))+"px";b.style.top=(inTa?Math.max(8,rect.top-40):Math.min(innerHeight-46,rect.bottom+8))+"px"}
function selAsk(){if(!SELN)return;const{n,text}=SELN;SELN=null;$("selask").hidden=true;try{getSelection().removeAllRanges()}catch(e){}pin(n,{label:text.replace(/\s+/g," ").slice(0,50),text:text.slice(0,600)})}
{const b=document.createElement("button");b.id="selask";b.hidden=true;b.textContent="Ask the AI about this";b.onpointerdown=b.onmousedown=e=>e.preventDefault();b.onclick=selAsk;document.body.appendChild(b);
for(const ev of["mouseup","keyup","touchend"])document.addEventListener(ev,()=>setTimeout(selUi,10));document.addEventListener("scroll",()=>{b.hidden=true},true)}
try{localStorage.removeItem("pf3")}catch(e){}

/* If a part was cut off inside a code block, drop that unfinished block so it cannot flip the code/text parity of the rest. */
const cut=s=>{s=String(s).trim();return(s.split("```").length-1)%2?s.slice(0,s.lastIndexOf("```")).trim():s};

const rs=b=>{const w=b.closest(".cb"),t=w.querySelector(".src");t.value=t.defaultValue;gr(t);w.querySelector(".ro").hidden=true};
